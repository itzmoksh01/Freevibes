name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # End-to-end over a real stdio transport: starts the built server as an
      # agent would, then asserts the tool contract and the blocked behaviour.
      # The CLI exits 1 while the provider is blocked, which is correct; the
      # smoke test asserts that exit code rather than failing on it.
      - name: Smoke test (stdio, tools, blocked behaviour)
        run: npm run smoke
        env:
          FREEVIBES_DATA_DIR: ${{ runner.temp }}/freevibes-ci

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Report production vulnerabilities
        run: npm audit --omit=dev || true
